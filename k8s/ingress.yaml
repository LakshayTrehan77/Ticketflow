apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticketflow-api
  namespace: ticketflow
spec:
  ingressClassName: nginx
  rules:
    - host: ticketflow.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ticketflow-api
                port:
                  number: 80
