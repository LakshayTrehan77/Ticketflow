# Example only. Do not commit real values.
# Copy to secret.yaml, change the values and run: kubectl apply -f k8s/secret.yaml
# (secret.yaml is not part of kustomization.yaml on purpose)
apiVersion: v1
kind: Secret
metadata:
  name: ticketflow-secret
  namespace: ticketflow
type: Opaque
stringData:
  SECRET_KEY: replace-with-a-long-random-string
  POSTGRES_PASSWORD: replace-with-a-db-password
  DATABASE_URL: postgresql://ticketflow:replace-with-a-db-password@postgres:5432/ticketflow
